<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15100d">
  <meta name="color-scheme" content="dark">
  <title>Expedition 69</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Web fonts load without blocking the page or the game: media="print" never blocks, onload applies them.
       src/main.js waits for them briefly (≤ 1.5 s) and starts in Georgia when they are slow or offline. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" media="print" data-webfonts onload="this.media='all'" onerror="this.dataset.webfonts='failed'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <canvas id="game" width="1280" height="720" aria-label="Expedition 69 game canvas"></canvas>
      <div id="ui" aria-live="polite"></div>
      <div id="fade"></div>
    </div>
    <div id="rotate-hint" aria-hidden="true"><i></i><span>Turn your device sideways</span><small>The expedition is best played in landscape.</small></div>
  </div>
  <noscript>Expedition 69 needs JavaScript enabled.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
